name: kernel-build
variant: scratch
shell: /bin/bash
dependencies:
  - stage: kernel-prepare
steps:
  - env:
      CARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}amd64{{ else }}unsupported{{ end }}
      ARCH: {{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}x86{{ else }}unsupported{{ end }}
      LLVM: 1
    prepare:
      - |
        cd /src
        cp -v /pkg/config-${CARCH} .config
        cp -v /pkg/certs/* certs/
      - |
        cd /src
        for patch in $(find /pkg/patches -type f -name "*.patch" | sort); do
          patch -p1 < $patch || (echo "Failed to apply patch $patch" && exit 1)
          echo "Applied patch $patch"
        done
    build:
      {{ if .BUILD_ARG_KERNEL_TARGET }}
      - |
        cd /src

        make {{ .BUILD_ARG_KERNEL_TARGET }}
      {{ else }}
      - |
        cd /src
        python3 /toolchain/kernel-hardening-checker/bin/kernel-hardening-checker -c .config -m json | python3 /pkg/scripts/filter-hardened-check.py ${CARCH}
      - |
        cd /src

        {{ if .BUILD_ARG_SCCACHE_S3_BUCKET }}
        # Optional sccache object cache (S3 backend). Transparent + fail-safe:
        # sccache produces bit-identical output to the underlying clang and, on
        # any backend error, falls back to a direct compile -- an unreachable or
        # misconfigured cache never fails the build. Active only with this arg.
        export PATH="/toolchain/bin:${PATH}"
        export SCCACHE_BUCKET="{{ .BUILD_ARG_SCCACHE_S3_BUCKET }}"
        export SCCACHE_ENDPOINT="{{ .BUILD_ARG_SCCACHE_ENDPOINT }}"
        export SCCACHE_S3_USE_SSL="{{ .BUILD_ARG_SCCACHE_S3_USE_SSL }}"
        export SCCACHE_S3_KEY_PREFIX="amt-kernel/{{ .linux_version }}"
        export SCCACHE_REGION=us-east-1
        export SCCACHE_IDLE_TIMEOUT=0
        # S3 credentials come from a context file the CI writes (NOT a build-arg,
        # which would leak into image metadata). Absent -> cache miss, build ok.
        [ -f /pkg/certs/sccache.env ] && . /pkg/certs/sccache.env
        sccache --start-server || true
        make -j $(nproc) CC="sccache clang" HOSTCC="sccache clang"
        make -j $(nproc) CC="sccache clang" HOSTCC="sccache clang" modules
        sccache --show-stats || true
        {{ else }}
        make -j $(nproc)
        make -j $(nproc) modules
        {{ end }}

        if [[ "${ARCH}" == "arm64" ]]; then
          echo "Compiling device-tree blobs"
          make -j $(nproc) DTC_FLAGS=-@ dtbs
        fi
      {{ end }}
finalize:
  {{ if .BUILD_ARG_KERNEL_TARGET }}
  - from: /src/.config
    to: config-{{ if eq .ARCH "aarch64"}}arm64{{ else if eq .ARCH "x86_64" }}amd64{{ else }}unsupported{{ end }}
  {{ else }}
  - from: /src
    to: /src
  - from: /toolchain
    to: /toolchain
  {{ end }}
