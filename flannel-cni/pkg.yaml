name: flannel-cni
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/flannel-io/cni-plugin/archive/refs/tags/{{ .flannel_cni_version }}.tar.gz
        destination: flannel-cni.tar.gz
        sha256: "{{ .flannel_cni_sha256 }}"
        sha512: "{{ .flannel_cni_sha512 }}"
  - network: default
    prepare:
      - |
        tar -xzf flannel-cni.tar.gz --strip-components=1
        # BLO-37661: this is the only network access in the whole recipe, and a
        # ~12s proxy.golang.org TLS blip here discarded a completed 5h build-a
        # in run 36368015537. Go's default GOPROXY is "proxy.golang.org,direct"
        # and the comma only fails over on 404/410, never on a transport error
        # (cmd/go/internal/modfetch/proxy.go: fallBackOnError), so the fetch had
        # exactly one attempt. go mod tidy/vendor are idempotent, so retry.
        for attempt in 1 2 3; do
          if go mod tidy && go mod vendor; then break; fi
          if [ "${attempt}" = 3 ]; then echo "go mod fetch failed after 3 attempts" >&2; exit 1; fi
          echo "go mod fetch failed (attempt ${attempt}/3); retrying in $((attempt * 15))s" >&2
          sleep "$((attempt * 15))"
        done
  - network: none
    build:
      - |
        export GOARCH=$(go env GOARCH)

        {{ if eq .ARCH "x86_64" }}
        export CGO_ENABLED=1
        {{ end }}

        sed -i '/GIT_TAG=/c GIT_TAG={{ .flannel_cni_version }}' scripts/version.sh
        sed -i '/COMMIT=/c COMMIT={{ .flannel_cni_ref }}' scripts/version.sh

        EXTRA_LDFLAGS=-s bash scripts/build_flannel.sh
    install:
      - |
        mkdir -p /rootfs/opt/cni/bin

        export GOARCH=$(go env GOARCH)

        mv dist/flannel-${GOARCH} /rootfs/opt/cni/bin/flannel
    test:
      - |
        fhs-validator /rootfs
    sbom:
      outputPath: /rootfs/usr/share/spdx/flannel-cni.spdx.json
      version: {{ .flannel_cni_version }}
      cpes:
        - cpe:2.3:a:flannel-io:cni-plugin:{{ .flannel_cni_version }}:*:*:*:*:*:*:*
        - cpe:2.3:a:flannel_io:cni-plugin:{{ .flannel_cni_version }}:*:*:*:*:*:*:*
        - cpe:2.3:a:flannel:cni-plugin:{{ .flannel_cni_version }}:*:*:*:*:*:*:*
      licenses:
        - Apache-2.0
finalize:
  - from: /rootfs
    to: /
