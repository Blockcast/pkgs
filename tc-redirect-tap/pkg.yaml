name: tc-redirect-tap
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: https://github.com/awslabs/tc-redirect-tap/archive/{{ .tc_redirect_tap_ref }}.tar.gz
        destination: tc-redirect-tap.tar.gz
        sha256: "{{ .tc_redirect_tap_sha256 }}"
        sha512: "{{ .tc_redirect_tap_sha512 }}"
  - network: default
    prepare:
      - |
        tar -xzf tc-redirect-tap.tar.gz --strip-components=1
        # BLO-37661: same single-attempt module fetch as flannel-cni; see the
        # comment there for why Go's default GOPROXY does not fail over.
        for attempt in 1 2 3; do
          if go mod download; then break; fi
          if [ "${attempt}" = 3 ]; then echo "go mod fetch failed after 3 attempts" >&2; exit 1; fi
          echo "go mod fetch failed (attempt ${attempt}/3); retrying in $((attempt * 15))s" >&2
          sleep "$((attempt * 15))"
        done
  - network: none
    build:
      - |
        CGO_ENABLED=0 GOFLAGS="-ldflags=-s" make
    install:
      - |
        make install CNI_BIN_ROOT=/rootfs/opt/cni/bin
    test:
      - |
        fhs-validator /rootfs
finalize:
  - from: /rootfs
    to: /
