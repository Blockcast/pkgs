# Build the patched Harbor registry-photon image (harbor-registry-photon/).
#
#   pull_request (same-repo head only) -> job `check`:   ./build.sh --check
#   workflow_dispatch on a non-main ref -> job `check`:   ./build.sh --check
#   push to main / dispatch on main     -> harbor-registry-photon-publish.yaml
#                                          (split out under BLO-55992 so no
#                                          PR-triggered file holds push creds)
#
# The image reference and every pin come from harbor-registry-photon/release.env;
# nothing about the image is defined in this file.
#
# Runner: GitHub-hosted. Only same-repository PRs run check; it has no write scope.

name: harbor-registry-photon

on:
  # README-only changes do not change the image: a PR would rebuild it on the
  # privileged runner for nothing, and a main push would hit build.sh's "tag
  # already exists" refusal unless PATCH_REVISION is bumped. main has no
  # required status checks, so skipping the run cannot strand a PR.
  pull_request:
    branches:
      - main
    paths:
      - 'harbor-registry-photon/**'
      - '!harbor-registry-photon/README.md'
      - '.github/workflows/harbor-registry-photon.yaml'
  workflow_dispatch: {}

concurrency:
  group: harbor-registry-photon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 240
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    # GitHub-hosted (BLO-55992): pull_request job, docker.io bases only, no push;
    # group 26 (public-repo-ci) admits only default-branch workflow refs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # version: v6.0.2

      - name: Docker daemon
        run: |
          set -euo pipefail
          docker version || { echo "docker daemon not reachable -- check dind / DOCKER_HOST" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # version: v4.1.0
        with:
          driver: docker

      - name: Build and verify (no push)
        run: |
          set -euo pipefail
          ref="$(harbor-registry-photon/build.sh --print-tag)"
          echo "image: $ref (not published)"
          harbor-registry-photon/build.sh --check
          {
            echo "### harbor-registry-photon"
            echo "- built and verified, **not pushed** (\`${GITHUB_EVENT_NAME}\` on \`${GITHUB_REF}\`)"
            echo "- would publish: \`${ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
