# Build the patched Harbor registry-photon image (harbor-registry-photon/).
#
#   pull_request (same-repo head only) -> job `check`:   ./build.sh --check
#   workflow_dispatch on a non-main ref -> job `check`:   ./build.sh --check
#   push to main / dispatch on main     -> job `publish`: ./build.sh --push
#                                          (refuses to repoint an existing tag)
#
# The image reference and every pin come from harbor-registry-photon/release.env;
# nothing about the image is defined in this file.
#
# Runner: ubuntu-24.04. This build only needs Docker; use the repository
# GitHub-hosted Linux pattern so releases do not wait for the cluster dind pool.
# Only same-repository PRs run check, and only the main publisher has packages: write.

name: harbor-registry-photon

on:
  # README-only changes do not change the image: a PR would rebuild it on the
  # privileged runner for nothing, and a main push would hit build.sh's "tag
  # already exists" refusal unless PATCH_REVISION is bumped. main has no
  # required status checks, so skipping the run cannot strand a PR.
  pull_request:
    branches:
      - main
    paths:
      - 'harbor-registry-photon/**'
      - '!harbor-registry-photon/README.md'
      - '.github/workflows/harbor-registry-photon.yaml'
  push:
    branches:
      - main
    paths:
      - 'harbor-registry-photon/**'
      - '!harbor-registry-photon/README.md'
      - '.github/workflows/harbor-registry-photon.yaml'
  workflow_dispatch: {}

concurrency:
  group: harbor-registry-photon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # version: v6.0.2

      - name: Docker daemon
        run: |
          set -euo pipefail
          docker version || { echo "docker daemon not reachable -- check dind / DOCKER_HOST" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # version: v4.1.0
        with:
          driver: docker

      - name: Build and verify (no push)
        run: |
          set -euo pipefail
          ref="$(harbor-registry-photon/build.sh --print-tag)"
          echo "image: $ref (not published)"
          harbor-registry-photon/build.sh --check
          {
            echo "### harbor-registry-photon"
            echo "- built and verified, **not pushed** (\`${GITHUB_EVENT_NAME}\` on \`${GITHUB_REF}\`)"
            echo "- would publish: \`${ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # version: v6.0.2

      - name: Docker daemon
        run: |
          set -euo pipefail
          docker version || { echo "docker daemon not reachable -- check dind / DOCKER_HOST" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # version: v4.1.0
        with:
          driver: docker

      - name: Login to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # version: v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, verify and push
        id: push
        run: |
          set -euo pipefail
          harbor-registry-photon/build.sh --push

      - name: Record digest
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest from build.sh: '$DIGEST'" >&2; exit 1; }
          repo="${REF%:*}"
          {
            echo "### harbor-registry-photon"
            echo "- pushed: \`${REF}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- deploy by digest: \`${repo}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
