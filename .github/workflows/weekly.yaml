# Generated by kres, then HAND-RESTRUCTURED -- `make rekres` overwrites this
# file with a single `group: pkgs` job. See .kres.yaml before running it.
#
# Runs on GitHub-hosted standard runners, which are free for public
# repositories. NOT on the self-hosted ARC groups: `pkgs` (id 6) stays closed to
# public repositories, and `pkgs-public` (id 14) is no longer needed by this
# repo (board card 04d714a4).
#
# The upstream single job (`make reproducibility-test`) cannot fit a
# GitHub-hosted job's 6h ceiling: on the cluster it took 9h06m (run
# 37253805723: build-a 4h48m, build-b 4h17m, both bounded by the
# QEMU-emulated arm64 half; amd64 finished in 1h55m / 1h08m on a 16-CPU
# BuildKit). So it is split the way the Makefile's
# reproducibility-test-local-% recipe already is:
#   build: one cold `make local-reproducibility` per platform x copy, each on a
#          fresh native runner (arm64 on ubuntu-24.04-arm, no QEMU), output
#          tarred and uploaded.
#   diff:  the recipe's last two lines -- touch + diffoscope -- per platform.
# A fresh runner has no BuildKit cache, so both copies are cold builds on
# different machines; the recipe's `--no-cache` on build-b is implied.

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
'on':
  schedule:
    - cron: 30 1 * * 1
  workflow_dispatch: {}
name: weekly
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        copy: [a, b]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The GitHub-hosted maximum; a larger value is silently capped.
    timeout-minutes: 360
    steps:
      - name: gather-system-info
        id: system-info
        uses: kenchan0130/actions-system-info@59699597e84e80085a750998045983daa49274c4 # version: v1.4.0
        continue-on-error: true
      - name: print-system-info
        run: |
          MEMORY_GB=$((${{ steps.system-info.outputs.totalmem }}/1024/1024/1024))

          OUTPUTS=(
            "CPU Core: ${{ steps.system-info.outputs.cpu-core }}"
            "CPU Model: ${{ steps.system-info.outputs.cpu-model }}"
            "Hostname: ${{ steps.system-info.outputs.hostname }}"
            "Kernel release: ${{ steps.system-info.outputs.kernel-release }}"
            "Platform: ${{ steps.system-info.outputs.platform }}"
            "Total memory: ${MEMORY_GB} GB"
          )

          for OUTPUT in "${OUTPUTS[@]}";do
            echo "${OUTPUT}"
          done
        continue-on-error: true
      # Standard runners guarantee only 14GB of SSD; the image actually had 86G
      # free on / (108G after this step) in run 37557259049. Drop preinstalled
      # SDKs this build never uses so BuildKit's state has room either way.
      - name: free-disk-space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # version: v7.0.0
      - name: Unshallow
        run: |
          git fetch --prune --unshallow
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # version: v4.2.0
      # One retry. A single fetch fault fails the whole solve: run 37557259049
      # got the wrong bytes for pigz from zlib.net on 1 of 4 runners
      # (digest mismatch) while the other 3 fetched it fine. The retry solves on
      # the same builder, so every vertex that already finished is reused.
      - name: build
        run: |
          build() {
            rm -rf _out/build-${{ matrix.copy }}
            make local-reproducibility PLATFORM=linux/${{ matrix.platform }} DEST=_out/build-${{ matrix.copy }}
          }
          build || { echo "::warning::build failed; retrying once on the same builder"; sleep 60; build; }
          df -h /
      # tar, not the artifact zip: diffoscope compares modes, symlinks and
      # mtimes, which the zip round-trip does not preserve.
      - name: pack
        run: |
          tar --format=posix -C _out -cf build-${{ matrix.copy }}.tar build-${{ matrix.copy }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # version: v7.0.1
        with:
          name: reproducibility-${{ matrix.platform }}-${{ matrix.copy }}
          path: build-${{ matrix.copy }}.tar
          if-no-files-found: error
          retention-days: 7
  diff:
    needs: build
    # Per platform: one platform's failed build must not hide the other's diff.
    # A missing tarball fails the extract below, so this cannot pass vacuously.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # BLO-40437: diffoscope is on no runner image. diffoscope-minimal
      # (noble/universe) over `diffoscope`, whose Recommends pull ffmpeg,
      # ghostscript and imagemagick; without them an undecodable binary diff
      # falls back to hexdump but still exits non-zero.
      - name: install-diffoscope
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope-minimal
          diffoscope --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # version: v8.0.1
        with:
          pattern: reproducibility-${{ matrix.platform }}-*
          merge-multiple: true
          path: _out
      - name: diffoscope
        working-directory: _out
        run: |
          tar -xpf build-a.tar
          tar -xpf build-b.tar
          # The recipe touches both top-level dirs to one date; only their
          # equality matters.
          touch -ch -r build-a build-b
          diffoscope build-a build-b
