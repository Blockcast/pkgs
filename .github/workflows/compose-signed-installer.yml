# Compose the DEPLOYABLE SecureBoot-signed Talos installer for the AMT data nodes:
#   imager = ghcr.io/blockcast/imager:<tag>           (custom kernel/payload)
#   base   = ghcr.io/blockcast/installer:<tag>        (custom installer base)
#   ext    = ghcr.io/blockcast/amt-kmod:<talos>      (signed amt.ko extension,
#            built by linux-amt build-amt-kmod-talos.yml)
#   -> ghcr.io/blockcast/installer:<tag>-signed
#
# Lightweight: pulls existing images + runs the matching custom imager to
# SecureBoot-sign the UKI while overlaying the extension onto the custom-kernel
# base. No kernel compile. Runs in CI so
# GITHUB_TOKEN carries packages:write (a local push from devbox is denied: the
# devbox gh token only has read:packages).
#
# Do NOT use the stock Sidero imager here. The imager supplies the UKI payload,
# so this workflow must use the matching Blockcast imager and the SecureBoot
# profile; otherwise the output can be tagged "signed" while still containing an
# unsigned or stock-kernel UKI.
name: compose-signed-installer
on:
  workflow_dispatch:
    inputs:
      base_installer:
        description: 'Custom installer base, e.g. ghcr.io/blockcast/installer:<talos>-amt'
        required: true
        type: string
      imager_image:
        description: 'Custom imager image; empty derives ghcr.io/blockcast/imager:<base tag>'
        default: ''
        type: string
      extension:
        description: 'Signed amt.ko extension; empty derives ghcr.io/blockcast/amt-kmod:<talos of base tag>'
        default: ''
        type: string
      out_tag:
        description: 'Output ref; empty derives <base_installer>-signed'
        default: ''
        type: string
      overwrite_harbor_tag:
        description: >-
          Repoint an EXISTING harbor.blockcast.net/library/talos-installer tag at
          this build. Off by default: the rollout runbook names rollback images
          by tag, so repointing one silently changes what a documented rollback
          resolves to. Promoting an identical digest is a no-op and needs no flag.
        default: false
        type: boolean
concurrency:
  group: compose-signed-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compose:
    runs-on: chromium-build
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # This job did not previously check out, because nothing in it read a
      # repo file. The Harbor promotion below runs .github/scripts/, so it does
      # now. Same SHA this repo's generated ci.yaml already uses.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve dind
        run: docker version || { echo "docker daemon not reachable" >&2; exit 1; }
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose + push signed installer
        id: compose
        env:
          # Cross-repo pull: the imager fetches the SIGNED amt-kmod extension
          # (Blockcast/linux-amt, private), which this repo's GITHUB_TOKEN cannot
          # read (GET .../amt-kmod/manifests: DENIED). Use the org PAT (read:packages
          # across repos) for the imager's ghcr auth. The docker login step above
          # keeps GITHUB_TOKEN for `docker push` of the output (a pkgs-owned package).
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GH_PAT }}
          BASE: ${{ inputs.base_installer }}
          IMAGER: ${{ inputs.imager_image }}
          EXT: ${{ inputs.extension }}
          OUT: ${{ inputs.out_tag }}
          TALOS_SECUREBOOT_UKI_SIGNING_KEY_PEM: ${{ secrets.TALOS_SECUREBOOT_UKI_SIGNING_KEY_PEM }}
          TALOS_SECUREBOOT_UKI_SIGNING_CERT_PEM: ${{ secrets.TALOS_SECUREBOOT_UKI_SIGNING_CERT_PEM }}
          TALOS_SECUREBOOT_PCR_SIGNING_KEY_PEM: ${{ secrets.TALOS_SECUREBOOT_PCR_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          mkdir -p _out && chmod 0777 _out

          if [ -z "${GHCR_PULL_TOKEN:-}" ]; then
            echo "GH_PAT secret with read:packages access to ghcr.io/blockcast/amt-kmod is required" >&2
            exit 1
          fi
          missing=0
          for name in \
            TALOS_SECUREBOOT_UKI_SIGNING_KEY_PEM \
            TALOS_SECUREBOOT_UKI_SIGNING_CERT_PEM \
            TALOS_SECUREBOOT_PCR_SIGNING_KEY_PEM
          do
            if [ -z "${!name:-}" ]; then
              echo "${name} secret is required for Talos secureboot-installer" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # base_installer is the only version this workflow is told. Everything
          # else derives from its tag, so the three refs cannot name different
          # Talos releases and no default can go stale (BLO-39684).
          : "${BASE:?base_installer is required}"
          case "$BASE" in
            ghcr.io/blockcast/installer:*)
              BASE_TAG="${BASE#ghcr.io/blockcast/installer:}"
              # BASE_TAG is the only version this workflow is told, and all three
              # refs below derive from it, so an unchecked one propagates. A
              # floating `latest` or an empty tag would otherwise compose and
              # publish a *signed* installer from components whose Talos pairing
              # was never checked -- the same class as the bug BLO-39684 closes.
              case "$BASE_TAG" in
                v[0-9]*.[0-9]*.[0-9]*-*) : ;;
                *) echo "base_installer tag '${BASE_TAG}' is not <version>-<variant>" >&2; exit 1 ;;
              esac
              : "${IMAGER:=ghcr.io/blockcast/imager:${BASE_TAG}}"
              # Deriving EXT is the one place this workflow has to split
              # <version>-<variant>, and that split is only unambiguous when the
              # tag carries exactly one hyphen. With two or more, both readings
              # are defensible and silently wrong in opposite directions:
              # ${BASE_TAG%%-*} pairs the GA extension amt-kmod:v1.14.0 with a
              # v1.14.0-alpha.0-amt base, while ${BASE_TAG%-*} mis-derives
              # amt-kmod:v1.13.4-amt-ct6 from the v1.13.4-amt-ct6-mroute tag the
              # glob above admits. Unlike the resolver, this workflow has no
              # Pkgfile to cross-check against -- base_installer is the only
              # version it is told -- so it refuses to guess on the *signed*
              # publishing path. Only the derivation is constrained: pass the
              # `extension` input and any tag shape works.
              if [ -z "${EXT:-}" ]; then
                case "${BASE_TAG#*-}" in
                  *-*) echo "cannot derive the extension from base_installer tag '${BASE_TAG}': <version>-<variant> is ambiguous with more than one hyphen; pass the extension input explicitly" >&2; exit 1 ;;
                esac
              fi
              : "${EXT:=ghcr.io/blockcast/amt-kmod:${BASE_TAG%%-*}}"
              : "${OUT:=${BASE}-signed}"
              ;;
            *)
              for n in IMAGER EXT OUT; do
                [ -n "${!n:-}" ] || { echo "${n} input is required when base_installer is not ghcr.io/blockcast/installer:<tag>" >&2; exit 1; }
              done
              ;;
          esac
          echo "base=$BASE imager=$IMAGER ext=$EXT out=$OUT"

          sock="${DOCKER_HOST#unix://}"
          sock="${sock:-/var/run/docker.sock}"
          test -S "$sock" || { echo "docker socket not found at '$sock' (DOCKER_HOST=${DOCKER_HOST:-})" >&2; exit 1; }

          imager_cfg="$RUNNER_TEMP/imager-docker"
          secureboot_dir="$(mktemp -d /dev/shm/talos-secureboot.XXXXXX 2>/dev/null || mktemp -d)"
          trap 'rm -rf "$imager_cfg" "$secureboot_dir"' EXIT

          mkdir -p "$imager_cfg"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$GHCR_USER" "$GHCR_PULL_TOKEN" | base64 -w0)" > "$imager_cfg/config.json"

          umask 077
          printf '%s\n' "$TALOS_SECUREBOOT_UKI_SIGNING_KEY_PEM" > "$secureboot_dir/uki-signing-key.pem"
          printf '%s\n' "$TALOS_SECUREBOOT_UKI_SIGNING_CERT_PEM" > "$secureboot_dir/uki-signing-cert.pem"
          printf '%s\n' "$TALOS_SECUREBOOT_PCR_SIGNING_KEY_PEM" > "$secureboot_dir/pcr-signing-key.pem"

          # Talos v1.13 parses these as PKCS#1 RSA keys. Normalize accepted PEM
          # inputs so PKCS#8 secrets fail here only if they are not RSA, rather
          # than later with an opaque imager parsing error.
          for key in uki-signing-key.pem pcr-signing-key.pem; do
            openssl rsa \
              -in "$secureboot_dir/$key" \
              -traditional \
              -out "$secureboot_dir/$key.pkcs1"
            mv "$secureboot_dir/$key.pkcs1" "$secureboot_dir/$key"
          done

          openssl pkey -in "$secureboot_dir/uki-signing-key.pem" -pubout \
            -out "$secureboot_dir/uki-signing-key.pub"
          openssl x509 -in "$secureboot_dir/uki-signing-cert.pem" -noout -subject -sha256 -fingerprint
          openssl x509 -in "$secureboot_dir/uki-signing-cert.pem" -pubkey -noout \
            > "$secureboot_dir/uki-signing-cert.pub"
          cmp -s "$secureboot_dir/uki-signing-key.pub" "$secureboot_dir/uki-signing-cert.pub"
          rm -f "$secureboot_dir/uki-signing-key.pub" "$secureboot_dir/uki-signing-cert.pub"
          openssl rsa -in "$secureboot_dir/pcr-signing-key.pem" -check -noout

          # DOCKER_CONFIG is required because the imager uses go-containerregistry
          # internally; the runner's docker login credStore is not visible there.
          compose_log="$RUNNER_TEMP/secureboot-imager.log"
          docker run --rm \
            -e DOCKER_CONFIG=/root/.docker \
            -v "$sock:/var/run/docker.sock" \
            -v "$imager_cfg/config.json:/root/.docker/config.json:ro" \
            -v "$secureboot_dir:/secureboot:ro" \
            -v "$PWD/_out:/out" \
            "$IMAGER" secureboot-installer \
            --base-installer-image "$BASE" \
            --system-extension-image "$EXT" \
            --arch amd64 2>&1 | tee "$compose_log"
          if grep -Eq 'secureboot: false|unsigned\.uki' "$compose_log"; then
            echo "imager log indicates an unsigned/non-SecureBoot UKI path; refusing to publish" >&2
            exit 1
          fi
          grep -q 'secureboot: true' "$compose_log"
          grep -q 'signing systemd-boot' "$compose_log"

          test -f _out/installer-amd64-secureboot.tar
          LOADED="$(docker load -i _out/installer-amd64-secureboot.tar | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p' | head -1)"
          test -n "$LOADED" || { echo "docker load produced no image" >&2; exit 1; }
          echo "composed SecureBoot installer loaded as: ${LOADED}"
          docker tag  "$LOADED" "$OUT"
          docker push "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "Published deployable SecureBoot signed installer: $OUT"

      # BLO-39281. The artifact above is now on ghcr, where the Talos nodes
      # CANNOT pull it from -- they carry no ghcr credential, so the fleet's
      # install.image is pinned to harbor.blockcast.net/library/talos-installer.
      # Until now that gap was closed by hand, from the rollout runbook, with a
      # `skopeo copy` whose --dest-creds carried the Harbor ADMIN password read
      # out of the harbor-bootstrap-secrets cluster secret. Removing that
      # credential from a human's command line is the main point of these
      # steps; not re-running the copy by hand is the lesser one.
      #
      # These run AFTER the push on purpose. A Harbor failure here cannot
      # corrupt or unpublish the signed installer -- it is already on ghcr by
      # its digest -- so the blast radius of this addition is a red run, never
      # a bad artifact. It is deliberately NOT allowed to fail softly: a
      # silently skipped promotion is indistinguishable from a successful one
      # right up to the moment a node tries to pull.
      - name: Install pinned crane
        env:
          CRANE_VERSION: v0.21.2
          CRANE_ARCHIVE_SHA256: 897e7c342db072ba76531246fc18fbf3e8e298688b6ecf98916770984b263866
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz" \
            --output "$archive"
          echo "$CRANE_ARCHIVE_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Promote the signed installer into Harbor
        env:
          OUT: ${{ steps.compose.outputs.out }}
          OVERWRITE: ${{ inputs.overwrite_harbor_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HARBOR_USERNAME HARBOR_PASSWORD; do
            [ -n "${!name:-}" ] || {
              echo "$name is required to promote into Harbor; refusing to skip silently" >&2
              exit 1
            }
          done

          # crane reads a Docker config, and this runner's docker login uses a
          # credStore that crane cannot see (the same reason the imager above is
          # handed its own config.json). So build one for crane explicitly
          # rather than relying on the earlier `docker login` having left
          # readable auths behind.
          # umask 077: config.json below holds the Harbor push credential, and
          # this is a shared self-hosted runner (same reason as the signing PEMs).
          umask 077
          crane_cfg="$RUNNER_TEMP/promote-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$crane_cfg"
          trap 'rm -rf "$crane_cfg"' EXIT
          printf '{"auths":{"ghcr.io":{"auth":"%s"},"harbor.blockcast.net":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w0)" \
            "$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 -w0)" \
            > "$crane_cfg/config.json"
          export DOCKER_CONFIG="$crane_cfg"

          args=(--source "$OUT")
          if [ "${OVERWRITE:-false}" = true ]; then
            args+=(--overwrite)
          fi
          .github/scripts/promote-installer-to-harbor.sh "${args[@]}"
