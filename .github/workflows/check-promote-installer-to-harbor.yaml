# BLO-39281. Gates the Harbor promotion guards in
# .github/scripts/promote-installer-to-harbor.sh, which compose-signed-installer.yml
# runs against the real registries after every signed-installer build.
#
# This lane exists because that one is dispatch-only: without it the guards
# would first be exercised during a production installer build, which is the
# worst possible moment to find a regression in the check that decides whether
# to repoint a tag the fleet may be pinned to.
#
# Pure bash against a stubbed `crane` -- no registry, no credential, no network.
#
# Shell-only tests run on GitHub-hosted runners; no cluster access is needed.
# Do not move this to `runs-on: pkgs` to match ci.yaml: that runner group has
# allows_public_repositories=false and this repo is public, so the job queues
# forever and gates nothing (BLO-37063). It sat inert here from 2026-10-02
# until 2026-10-05 for exactly that reason, while the identical workflow on
# main ran green on ubuntu-latest.
name: check-promote-installer-to-harbor

on:
  pull_request:
    paths:
      - .github/scripts/promote-installer-to-harbor.sh
      - .github/scripts/test-promote-installer-to-harbor.sh
      - .github/scripts/test-promote-installer-mutations.sh
      - .github/workflows/check-promote-installer-to-harbor.yaml
      - .github/workflows/compose-signed-installer.yml
  push:
    branches:
      - main
    # Repeated rather than a YAML anchor: GitHub Actions' workflow parser does
    # not resolve anchors/aliases.
    paths:
      - .github/scripts/promote-installer-to-harbor.sh
      - .github/scripts/test-promote-installer-to-harbor.sh
      - .github/scripts/test-promote-installer-mutations.sh
      - .github/workflows/check-promote-installer-to-harbor.yaml
      - .github/workflows/compose-signed-installer.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Guard tests
        run: .github/scripts/test-promote-installer-to-harbor.sh

      # A guard with no failing mutation is a comment. This removes each guard
      # in turn and requires the suite above to go red, so a guard cannot be
      # quietly deleted while its tests keep passing.
      - name: Every guard has a failing mutation
        run: .github/scripts/test-promote-installer-mutations.sh
