---
# ⚠ `make rekres` OVERWRITES .github/workflows/weekly.yaml AND .github/workflows/
# ci.yaml AND BOTH .github/workflows/slack-notify*.yaml AND WILL DROP EIGHT
# HAND-EDITS THAT ARE NOT EXPRESSIBLE HERE.
# Re-apply all eight after running it:
#   1. weekly.yaml: RESTRUCTURED for GitHub-hosted runners (board card
#      04d714a4). kres emits one `group: pkgs` job running
#      `make reproducibility-test`; that took 9h06m on the cluster, nearly all
#      of it QEMU-emulated arm64, past GitHub-hosted's 6h job ceiling. The hand
#      version is a `build` matrix (platform x copy, arm64 on native
#      ubuntu-24.04-arm; 11m/25m per copy) plus a per-platform `diff` job,
#      adds `workflow_dispatch`, and sets `contents: read`. Restore
#      the whole file from git after rekres -- do not re-route it to a
#      self-hosted group: `pkgs` (id 6) stays closed to public repositories.
#      Supersedes the `runs-on: pkgs-public` edit (BLO-21948).
#   2. (retired with 1) weekly.yaml `timeout-minutes: 960` — BLO-37661.
#      GitHub-hosted jobs cap at 360; each build job now sets exactly that.
#   3. ci.yaml: `"on"` REDUCED to `workflow_dispatch: {}` — the `push` and
#      `pull_request` triggers are deliberately removed — BLO-37063.
#      Both ci.yaml jobs are `runs-on: pkgs`, a runner group with
#      allows_public_repositories=false, and this repo is public: over the full
#      retained window of ci.yaml runs, zero success and no job ever assigned a
#      runner. Re-adding the triggers without first fixing the runner route
#      re-creates a permanently-queued `default` check-run, which is a hard stop
#      under the agent merge-gate rule on every PR in the repo. See the marked
#      comment at the top of ci.yaml.
#   4. ci.yaml: the three publish steps (`Login to registry`, `Push to
#      registry`, `Push nonfree`) carry an added
#      `&& (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/v'))`
#      — BLO-37063. kres gates them on `github.event_name != 'pull_request'`
#      alone, which under the workflow_dispatch-only trigger from (3) means a
#      dispatch against ANY branch would run `make PUSH=true` to ghcr with the
#      build and `check-dirty` steps skipped. The guard preserves the removed
#      trigger's `main`, `release-*`, and `tags: [v*]` refs; a bare `refs/tags/`
#      would widen it to any tag. Keep the three publish guards together.
#   5. ci.yaml: `release-notes` and `Release` carry
#      `startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch'`
#      -- BLO-37063. kres emits the bare `startsWith(github.ref, 'refs/tags/')`,
#      which under the workflow_dispatch-only trigger from (3) lets a dispatch
#      against any tag run `make release-notes` and softprops/action-gh-release
#      under `contents: write` with the build and `check-dirty` steps skipped.
#      Keep (3), (4) and (5) together.
#   6. slack-notify-ci-failure.yaml: `workflow_run.workflows` EXTENDED from
#      `[default]` to add `check-build-params`,
#      `check-promote-installer-to-harbor`, `harbor-registry-photon` and
#      `weekly` — BLO-40066. kres derives that list from its own workflow set
#      and cannot name the hand-written workflows in this repo. This edit is a
#      direct consequence of (3): once `default` is workflow_dispatch-only it
#      produces nothing automatically, so a notifier watching only `default`
#      goes dormant and reads identical to a healthy one on every dashboard.
#      Measured 2026-10-05 — its last 6 runs all `skipped`, while
#      `check-build-params` failed twice on push to main the day before with no
#      notification sent. If (3) is ever reverted, (6) stays correct as-is:
#      `default` is still first in the list. Do not drop it back to `[default]`.
#   7. BOTH slack-notify.yaml AND slack-notify-ci-failure.yaml: `runs-on:`
#      changed from `group: generic` to `ubuntu-latest` — BLO-40066. kres emits
#      the group form; **no runner group named `generic` exists in this org**
#      (org groups 2026-10-05: default, macos, drain, pkgs, pop-fleet,
#      blo13673-uat, sccache-writer, arc-storage-wffc-canary,
#      arc-paperclip-general, arc-merge-queue, arc-paperclip-buildkit,
#      pkgs-public, plus `-tools` variants). Every dispatch therefore failed
#      instantly — 1s wall, `runner_name: ""`, 0 steps, annotation
#      `Required runner group 'generic' not found` — so BOTH Slack channels were
#      dark. Measured: slack-notify 30/30 `failure` over its last 30 runs;
#      slack-notify-ci-failure's last non-`skipped` run (2026-06-18) failed the
#      same way. This is NOT the BLO-21948/BLO-37063 shape: that one is a real
#      group a public repo may not use, which queues 24h and is reaped. A
#      nonexistent group fails in one second. Both read as a dead notifier; only
#      the annotation tells them apart. (6) is inert without (7) — keep together.
#   8. weekly.yaml: the `install-diffoscope` step, now first in the `diff`
#      job of (1) — BLO-40437. Makefile:234 ends the target with
#      `diffoscope build-a build-b`; diffoscope is on no runner image
#      (siderolabs/pkgs assumes its own runners carry it). Run 37253805723
#      finished BOTH builds and died on that last line, `Error 127`, 9h06m in.
#      Keep the `diffoscope --version` probe — an install that silently no-ops
#      reproduces the identical Error 127 after the builds.
# None of the weekly.yaml edits has a spec field: kres builds that job as a Go
# literal with no runner, timeout or job-shape override (siderolabs/kres
# internal/project/pkgfile/build.go, the weekly Workflow in CompileGitHubWorkflow).
# The durable fix is a knob upstream in kres to stop generating weekly.yaml.
#
# A THIRD drift-prone edit exists, by a DIFFERENT mechanism -- `rekres` does not
# touch it, an upstream sync reverts it: the `network: default` retry blocks in
# flannel-cni/pkg.yaml and tc-redirect-tap/pkg.yaml (BLO-37661). Those files are
# otherwise byte-identical to siderolabs/pkgs. Guarded by
# hack/test-module-fetch-retry.sh -- run it after any upstream sync.
kind: pkgfile.Build
spec:
  targets:
    # - non-related to the kernel, in alphabetical order
    - apparmor
    - btrfsprogs
    - ca-certificates
    - cni
    - containerd
    - cpio
    - cryptsetup
    - curl
    - dosfstools
    - dtc
    - e2fsprogs
    - elfutils
    - fhs
    - flannel-cni
    - gcc-runtime
    - glib
    - gmp
    - gnutls
    - grub
    - igzip
    - ipmitool
    - iptables
    - ipxe
    - kmod
    - libaio
    - libarchive
    - libattr
    - libbpf
    - libburn
    - libcap
    - libffi
    - libinih
    - libisoburn
    - libisofs
    - libjansson
    - libjson-c
    - liblzma
    - libmnl
    - libnftnl
    - libpopt
    - libseccomp
    - libselinux
    - libsepol
    - libtasn1
    - libucontext
    - libunistring
    - liburcu
    - linux-firmware
    - lvm2
    - mdadm-pkg
    - mtools
    - musl
    - musl-fts
    - musl-obstack
    - nettle
    - nftables
    - openssl
    - open-vmdk
    - pcre2
    - perf-pkg
    - pigz
    - qemu-tools
    - runc
    - sd-boot
    - socat
    - squashfs-tools
    - systemd-udevd
    - talosctl-cni-bundle
    - tar
    - util-linux
    - xfsprogs
    - xz
    - zlib
    - zstd
    # - kernel & dependent packages (out of tree kernel modules)
    #   kernel first, then packages in alphabetical order
    - kernel
    - drbd-pkg
    - ena-pkg
    - gasket-driver-pkg
    - hailort-pkg
    - mellanox-mstflint-pkg
    - nvidia-open-gpu-kernel-modules-lts-pkg
    - nvidia-open-gpu-kernel-modules-production-pkg
    - px-fuse-pkg
    - tenstorrent-pkg
    - xdma-driver-pkg
    - zfs-pkg
  additionalTargets:
    nonfree:
      - nonfree-kmod-nvidia-lts-pkg
      - nonfree-kmod-nvidia-production-pkg
  reproducibleTargetName: reproducibility
  extraBuildArgs:
    - GNU_MIRROR_URL
  makefile:
    extraVariables:
      - name: GNU_MIRROR_URL
        defaultValue: https://mirrors.kernel.org
---
kind: auto.CustomSteps
spec:
  steps:
    - name: kernel-olddefconfig
      toplevel: true
    - name: kernel-%
      toplevel: true
    - name: drbd-gen-compat
      toplevel: true
    - name: check-dirty
      toplevel: true
---
kind: custom.Step
name: kernel-olddefconfig
spec:
  makefile:
    enabled: true
    script:
      - |
        @$(MAKE) local-kernel-build TARGET_ARGS="--build-arg=KERNEL_TARGET=olddefconfig" PLATFORM=linux/amd64 DEST="kernel/build"
        @$(MAKE) local-kernel-build TARGET_ARGS="--build-arg=KERNEL_TARGET=olddefconfig" PLATFORM=linux/arm64 DEST="kernel/build"
  ghaction:
    enabled: true
    condition: on-pull-request
---
kind: custom.Step
name: kernel-%
spec:
  makefile:
    enabled: true
    script:
      - |
        for platform in $(shell echo $(PLATFORM) | tr "," " "); do \
          arch=`basename $$platform` ; \
          $(MAKE) docker-kernel-prepare PLATFORM=$$platform BUILDKIT_MULTI_PLATFORM=0 TARGET_ARGS="--tag=$(REGISTRY)/$(USERNAME)/kernel:$(TAG)-$$arch --load"; \
          docker run --rm -it --entrypoint=/bin/bash -w /src -v $$PWD/kernel/build/config-$$arch:/host/.hostconfig $(REGISTRY)/$(USERNAME)/kernel:$(TAG)-$$arch -c 'cp /host/.hostconfig .config && make LLVM=1 $* && cp .config /host/.hostconfig'; \
        done
---
kind: custom.Step
name: drbd-gen-compat
spec:
  makefile:
    enabled: true
    phony: true
    script:
      - |
        @for platform in $(shell echo $(PLATFORM) | tr "," " "); do \
          arch=`basename $$platform` ; \
          ARCH=$$arch bash hack/drbd-gen-compat.sh ; \
        done
---
kind: custom.Step
name: check-dirty
spec:
  makefile:
    enabled: true
    phony: true
    script:
      - |
        @if test -n "`git status --porcelain`"; then echo "Source tree is dirty"; git status; git diff; exit 1 ; fi
  ghaction:
    enabled: true
    condition: on-pull-request
---
kind: common.Renovate
spec:
  customDatasources:
    nvidia-driver-lts:
      defaultRegistryUrlTemplate: https://docs.nvidia.com/datacenter/tesla/drivers/releases.json
      transformTemplates:
        - '{"releases": $.*[type="lts branch"].driver_info.{"version": release_version}}'
    nvidia-driver-production:
      defaultRegistryUrlTemplate: https://docs.nvidia.com/datacenter/tesla/drivers/releases.json
      transformTemplates:
        - '{"releases": $.*[type="production branch"].driver_info.{"version": release_version}}'
  packageRules:
    - matchPackageNames:
        - git://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      allowedVersions: "< 6.19"
    - matchPackageNames:
        - ipmitool/ipmitool
        - git://sourceware.org/git/lvm2.git
      versioning: 'regex:^(?<major>\d+)_(?<minor>\d+)_?(?<patch>\d+)?$'
    - matchPackageNames:
        - git://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git
      versioning: 'regex:^(?<major>\d{4})(?<minor>\d{2})(?<patch>\d{2})\.?(?<build>\d+)?$'
    - matchPackageNames:
        - nvidia-driver-lts
        - nvidia-driver-production
        - dosfstools/dosfstools
        - git://git.savannah.gnu.org/grub.git
        - https://pagure.io/libaio.git
        - rpm-software-management/popt
        - git://git.liburcu.org/userspace-rcu.git
        - madler/pigz
      versioning: 'regex:^(?<major>\d+)\.(?<minor>\d+)\.?(?<patch>\d+)?$'
    - matchPackageNames:
        - benhoyt/inih
        - systemd/systemd
        - tenstorrent/tt-kmd
      versioning: 'regex:^(?<major>\d+)\.?(?<minor>\d+)?\.?(?<patch>\d+)?$'
    - matchPackageNames:
        - git://repo.or.cz/socat.git
        - json-c/json-c
      versioning: 'regex:^(?<major>\d+)\.(?<minor>\d+)\.?(?<patch>\d+)?\.?(?<build>\d+)?$'
    - matchPackageNames:
        - openzfs/zfs
      versioning: 'regex:^(?<major>\d+)\.(?<minor>\d+)\.?(?<patch>[0-9]{1}[0-8]{0,1})?$'
    - matchPackageNames:
        - flannel-io/cni-plugin
      versioning: 'regex:^v(?<major>\d+)\.(?<minor>\d+)\.?(?<patch>\d+)?\.?-flannel(?<build>\d+)?$'
